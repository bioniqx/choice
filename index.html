<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm hướng kiếm tiền phù hợp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF3F0; --card:#F9FCFA; --ink:#12303A; --muted:#4C6770;
  --teal:#1A7A8C; --note:#0F5566; --on-note:#EAF6F2; --on-accent:#FFFFFF;
  --green:#4F8A3C; --plum:#9C3D6E; --gold:#B98A2E; --line:rgba(18,48,58,.2);
  --display:"Big Shoulders Display","Big Shoulders","Oswald","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E2229; --card:#14303A; --ink:#E4EFEA; --muted:#9DB6BC;
    --teal:#56B7C8; --note:#0F5566; --on-note:#EAF6F2; --on-accent:#0E2229;
    --green:#8CC474; --plum:#DE86B4; --gold:#D9B25C; --line:rgba(228,239,234,.2);
  }
}
:root[data-theme="dark"]{
  --paper:#0E2229; --card:#14303A; --ink:#E4EFEA; --muted:#9DB6BC;
  --teal:#56B7C8; --note:#0F5566; --on-note:#EAF6F2; --on-accent:#0E2229;
  --green:#8CC474; --plum:#DE86B4; --gold:#D9B25C; --line:rgba(228,239,234,.2);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2.6rem,9vw,4.4rem)}
h2{font-size:clamp(1.9rem,6vw,2.6rem)}
h3{font-size:1.45rem;font-weight:600}
p{margin:0 0 1em}
.wrap{max-width:42rem;margin:0 auto;padding:0 1.25rem 4rem}

/* progress strip */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:42rem;margin:0 auto;padding:.7rem 1.25rem .6rem}
.segs{display:flex;gap:4px}
.seg{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s ease}
.bar-label{font-size:.82rem;color:var(--muted);margin-top:.35rem;min-height:1.3em}
.bar[hidden]{display:none}

/* intro */
.hero{position:relative;padding:3.2rem 0 1.5rem;overflow:hidden}
.hero h1{position:relative;max-width:11em}
.hero .rosette{position:absolute;right:-7rem;top:-2rem;width:24rem;height:24rem;color:var(--teal);opacity:.4;pointer-events:none}
.lede{font-size:1.1rem;max-width:34em;margin-top:1.2rem;position:relative}
.measures{margin:2rem 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.measures li{display:grid;grid-template-columns:3.2rem 1fr;gap:.75rem;padding:.85rem 0;border-bottom:1px solid var(--line);align-items:baseline}
.measures b{font-family:var(--display);font-size:1.7rem;font-weight:800;color:var(--teal);line-height:1}
.measures span{display:block}
.measures small{color:var(--muted);font-size:.88rem}
.fine{font-size:.88rem;color:var(--muted)}

/* buttons */
.btn{font:600 1rem var(--body);padding:.85rem 1.5rem;border-radius:4px;border:1.5px solid var(--teal);background:var(--teal);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal)}
.btn:focus-visible,.linkbtn:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font:500 .95rem var(--body);text-decoration:underline;cursor:pointer}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2.2rem;align-items:center;flex-wrap:wrap}
.warn{color:var(--plum);font-size:.92rem;font-weight:500;flex-basis:100%;min-height:1.4em;margin:0}

/* questions */
.sec-head{padding:2.2rem 0 1.2rem}
.sec-head p{color:var(--muted);margin:.6rem 0 0;max-width:36em}
fieldset.q{border:0;margin:0;padding:1.15rem 0;border-top:1px solid var(--line)}
fieldset.q.miss legend{color:var(--plum)}
fieldset.q legend{padding:0;font-weight:500;margin-bottom:.7rem;max-width:36em}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:26rem}
.scale label,.opts label{position:relative;display:block;cursor:pointer}
.scale input,.opts input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.scale span{display:block;text-align:center;padding:.6rem 0;border:1.5px solid var(--line);border-radius:4px;background:var(--card);font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.2}
.scale input:checked + span,.opts input:checked + span{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.scale input:focus-visible + span,.opts input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.ends{display:flex;justify-content:space-between;max-width:26rem;font-size:.8rem;color:var(--muted);margin-top:.35rem}
.opts{display:grid;gap:6px;max-width:30rem}
.opts span{display:block;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:4px;background:var(--card)}

/* result */
.note{position:relative;overflow:hidden;background:var(--note);color:var(--on-note);border-radius:6px;padding:1.6rem 1.5rem 1.5rem;margin:1.6rem 0 1rem}
.note .rosette{position:absolute;right:-5.5rem;bottom:-6.5rem;width:20rem;height:20rem;opacity:.35;pointer-events:none}
.note .pct{font-family:var(--display);font-weight:800;font-size:clamp(4.2rem,20vw,7.5rem);line-height:.95;position:relative}
.note .pct small{font-size:.3em;font-weight:600;margin-left:.3rem}
.note h2{position:relative;margin-top:.5rem;max-width:14em}
.note p{position:relative;margin:.8rem 0 0;max-width:32em}
.block{padding:2rem 0 0}
.block > h2{margin-bottom:.9rem}
.meter{display:grid;grid-template-columns:minmax(7.5rem,11rem) 1fr 2.4rem;gap:.7rem;align-items:center;padding:.3rem 0;font-size:.95rem}
.meter .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--teal)}
.meter.g .track i{background:var(--green)}
.meter.p .track i{background:var(--plum)}
.meter.y .track i{background:var(--gold)}
.meter em{font-style:normal;text-align:right;font-family:var(--display);font-weight:600;font-size:1.1rem}
.sub{font-weight:600;margin:1.4rem 0 .4rem}
.code{font-family:var(--display);font-weight:800;font-size:2.4rem;color:var(--teal);letter-spacing:.06em;line-height:1}
.mode{border-left:4px solid var(--gold);padding:.2rem 0 .2rem 1rem;margin-top:.6rem}
.mode h3{margin-bottom:.4rem}
.sortrow{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.92rem;margin-bottom:.4rem}
.sortrow label{cursor:pointer;display:flex;gap:.4rem;align-items:center}
details.path{border-top:1px solid var(--line)}
details.path:last-of-type{border-bottom:1px solid var(--line)}
details.path summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2rem 1fr auto;gap:.6rem;align-items:baseline;padding:.95rem 0}
details.path summary::-webkit-details-marker{display:none}
details.path .rank{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--muted)}
details.path .nm{font-weight:600}
details.path .sc{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--teal)}
details.path .body{padding:0 0 1.2rem 2.6rem}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:.2rem 1.2rem;margin:.8rem 0;font-size:.9rem}
.facts div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:.25rem 0}
.facts b{font-weight:600}
.note .facts div{border-color:rgba(234,246,242,.35)}
ul.tight{margin:.3rem 0 .9rem;padding-left:1.15rem}
ul.tight li{margin:.2rem 0}
.rest{columns:2;column-gap:2rem;font-size:.92rem;padding:0;list-style:none;margin:.8rem 0 0}
.rest li{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0;break-inside:avoid}
.refs{font-size:.88rem;color:var(--muted);padding-left:1.15rem}
.refs li{margin:.35rem 0}
textarea.copy{width:100%;min-height:11rem;font:400 .85rem/1.5 var(--body);background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:4px;padding:.7rem;margin-top:.8rem}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
.ok{color:var(--green);font-weight:500;font-size:.92rem}
@media (max-width:520px){
  .facts{grid-template-columns:1fr}
  .rest{columns:1}
  details.path .body{padding-left:0}
  .hero .rosette{width:18rem;height:18rem;right:-8rem}
}
@media (prefers-reduced-motion:reduce){.seg i{transition:none}}
</style>
</head>

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function clamp(x){return Math.max(0,Math.min(1,x));}

/* ---------- Hoạ tiết guilloche (kiểu vân bảo an trên tờ tiền) ---------- */
function rosette(){
  var cx=200,cy=200,out="";
  [[150,26,9,16],[96,18,14,12]].forEach(function(cfg){
    var R=cfg[0],amp=cfg[1],n=cfg[2],curves=cfg[3];
    for(var k=0;k<curves;k++){
      var d="",ph=k*(Math.PI*2/curves);
      for(var t=0;t<=Math.PI*2+0.02;t+=0.02){
        var r=R+amp*Math.sin(n*t+ph);
        d+=(t===0?"M":"L")+(cx+r*Math.cos(t)).toFixed(1)+" "+(cy+r*Math.sin(t)).toFixed(1);
      }
      out+='<path d="'+d+'Z"/>';
    }
  });
  return '<svg class="rosette" viewBox="0 0 400 400" aria-hidden="true" fill="none" stroke="currentColor" stroke-width=".7">'+out+'<circle cx="200" cy="200" r="58"/><circle cx="200" cy="200" r="186"/></svg>';
}

/* ---------- Chấm điểm ---------- */
function nrm(v){return (v-1)/4;}
function compute(a){
  var g=function(k){return nrm(a[k]||3);};
  var ri={},abs={},m=0;
  "RIASEC".split("").forEach(function(t){abs[t]=(g(t+"1")+g(t+"2")+g(t+"3"))/3;m+=abs[t]/6;});
  "RIASEC".split("").forEach(function(t){ri[t]=.5*abs[t]+.5*clamp(.5+(abs[t]-m)*1.5);});
  var b5={};"OCEAN".split("").forEach(function(t){b5[t]=(g(t+"_a")+(1-g(t+"_r")))/2;});
  var ent=0;for(var i=1;i<=6;i++)ent+=g("T"+i)/6;
  var sk={};Object.keys(SKILL_NAME).forEach(function(k){sk[k]=g(k);});
  var c=a.ctx||{};
  var runway=(c.runway||0)/3,dep=[1,.5,.15][c.dep||0],pref=[0,.5,1][c.pref||0];
  var riskCap=.4*runway+.25*dep+.35*pref;
  var userEnt=.6*ent+.4*riskCap;
  var userCap=[.1,.35,.65,1][c.capital||0],userHor=[.15,.4,.7,1][c.horizon||0];

  var paths=PATHS.map(function(p){
    var k,w,sw=0,I=0,P=0,S=0;
    for(k in p.r){I+=p.r[k]*ri[k];sw+=p.r[k];} I/=sw; sw=0;
    for(k in p.p){w=p.p[k];P+=Math.abs(w)*(w>0?b5[k]:1-b5[k]);sw+=Math.abs(w);} P/=sw; sw=0;
    for(k in p.sk){S+=p.sk[k]*sk[k];sw+=p.sk[k];} S/=sw;
    var E=1-(userEnt<p.ent?(p.ent-userEnt):.4*(userEnt-p.ent));
    var fit=.38*I+.17*P+.30*S+.15*E;
    var capGap=Math.max(0,p.cap-userCap),horGap=Math.max(0,p.tti-userHor);
    fit*=(1-.35*capGap)*(1-.35*horGap);
    var why=[],gaps=[];
    for(k in p.r){if(p.r[k]>=2&&ri[k]>=.55)why.push([p.r[k]*ri[k],"Bạn thích nhóm việc "+RIASEC_NAME[k].toLowerCase()]);}
    for(k in p.sk){
      if(p.sk[k]>=2&&sk[k]>=.75)why.push([p.sk[k]*sk[k],"Kỹ năng mạnh: "+SKILL_NAME[k].toLowerCase()]);
      if(p.sk[k]>=2&&sk[k]<=.5)gaps.push("Kỹ năng cần nâng: "+SKILL_NAME[k].toLowerCase());
    }
    for(k in p.p){
      w=p.p[k];
      if(w>=2&&b5[k]>=.65)why.push([w*b5[k]*.8,"Tính cách: "+B5_NAME[k].toLowerCase()+" ở mức cao"]);
      if(w>=2&&b5[k]<.45)gaps.push("Hướng này đòi hỏi "+B5_NAME[k].toLowerCase()+", hiện là điểm thấp của bạn");
    }
    if(capGap>0)gaps.push("Vốn cần nhiều hơn mức bạn có thể mất");
    if(horGap>0)gaps.push("Thời gian ra tiền dài hơn mức bạn cần");
    if(userEnt<p.ent-.2)gaps.push("Mức rủi ro cao hơn sức chịu đựng hiện tại của bạn");
    why.sort(function(x,y){return y[0]-x[0];});
    return {p:p,fit:fit,combined:fit*(.65+.35*p.up),why:why.slice(0,4).map(function(x){return x[1];}),gaps:gaps};
  });

  var mode=(userEnt>=.68&&(c.runway||0)>=2)?"founder":(userEnt>=.45?"hybrid":"employee");
  return {ri:abs,b5:b5,ent:ent,riskCap:riskCap,userEnt:userEnt,sk:sk,paths:paths,mode:mode,ctx:c};
}

function level(v,labels){return labels[v<.25?0:v<.5?1:v<.8?2:3];}

        '</div></fieldset>';
    }else{
      var v=state.ans[id],ends=SCALES[s.scale];
      html+='<fieldset class="q" data-id="'+id+'"><legend>'+esc(it[1])+'</legend><div class="scale">'+
        [1,2,3,4,5].map(function(n){return '<label><input type="radio" name="'+id+'" value="'+n+'"'+(v===n?" checked":"")+' aria-label="'+n+' trên 5"><span>'+n+'</span></label>';}).join("")+
        '</div><div class="ends"><span>'+ends[0]+'</span><span>'+ends[1]+'</span></div></fieldset>';
    }
  });
  html+='<div class="nav"><p class="warn" id="warn" role="status"></p>'+
    '<button class="btn ghost" data-act="back">Quay lại</button>'+
    '<button class="btn" data-act="next">'+(i===SECTIONS.length-1?"Xem kết quả":"Tiếp tục")+'</button></div>';
  app.innerHTML=html;
}

function meter(label,v,cls){
  var pct=Math.round(v*100);
  return '<div class="meter '+(cls||"")+'"><span>'+esc(label)+'</span><div class="track"><i style="width:'+pct+'%"></i></div><em>'+pct+'</em></div>';
}
function facts(p){
  return '<div class="facts">'+
   '<div><span>Trần thu nhập</span><b>'+level(p.up,L_UP)+'</b></div>'+
   '<div><span>Vốn ban đầu</span><b>'+level(p.cap,L_CAP)+'</b></div>'+
   '<div><span>Thời gian ra tiền</span><b>'+level(p.tti,L_TTI)+'</b></div>'+
   '<div><span>Rủi ro thu nhập</span><b>'+level(p.ent,L_RISK)+'</b></div></div>';
}
function list(arr){return '<ul class="tight">'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';}

var MODE={
 founder:["Dồn toàn thời gian cho kinh doanh","Khuynh hướng làm chủ và sức chịu rủi ro tài chính của bạn đều cao. Bạn có thể dồn toàn thời gian cho việc kinh doanh, với điều kiện giai đoạn thử nghiệm đã có khách trả tiền thật."],
 hybrid:["Giữ thu nhập chính, thử kinh doanh song song","Người khởi nghiệp trong lúc vẫn giữ việc chính có nguy cơ thất bại thấp hơn 33% so với người nghỉ việc ngay (Raffiee & Feng, 2014). Dành 10–15 giờ mỗi tuần cho hướng mới và chỉ rời việc chính khi hướng mới đã có doanh thu lặp lại."],
 employee:["Tối đa hoá thu nhập từ chuyên môn","Hồ sơ của bạn nghiêng về ổn định. Thu nhập trung vị của người tự kinh doanh thấp hơn người làm thuê cùng năng lực (Hamilton, 2000), nên đây không phải lựa chọn kém. Đòn bẩy của bạn là chuyên môn hiếm, tiếng Anh, và chuyển sang nơi trả cao hơn: công ty nước ngoài hoặc vai trò gắn với doanh thu."]
};
var STATUS_NOTE=[
 "Bạn đang làm công ăn lương: công việc hiện tại chính là nguồn vốn cho các phép thử.",
 "Bạn đang làm tự do: bước tăng thu nhập nhanh nhất thường là đóng gói dịch vụ thành sản phẩm giá cố định và tăng giá.",
 "Bạn đã có việc kinh doanh: dùng bảng xếp hạng để quyết định nên đào sâu mô hình hiện tại hay mở nhánh mới.",
 "Bạn đang giữa hai chặng: ưu tiên hướng có thời gian ra tiền ngắn để ổn định dòng tiền trước."
];

function workStyle(r){
  var b=r.b5,o=[];
  o.push(b.E>=.65?"Tiếp xúc trực tiếp với khách hàng và đối tác là lợi thế của bạn. Dành phần lớn thời gian cho gặp gỡ, bán hàng, xây quan hệ; tìm cộng sự lo hậu cần."
    :b.E<=.4?"Bạn làm tốt nhất khi tập trung sâu, ít họp. Ưu tiên việc làm sản phẩm, viết, phân tích, và kênh bán không cần gặp mặt như nội dung, quảng cáo, khách giới thiệu."
    :"Bạn linh hoạt giữa làm độc lập và giao tiếp. Chia tuần thành ngày gặp người và ngày làm sâu.");
  o.push(b.C>=.65?"Bạn tự quản tốt, hợp với làm từ xa, làm tự do hoặc tự kinh doanh mà không cần ai giám sát."
    :b.C<=.45?"Kỷ luật tự giác là điểm nghẽn thu nhập lớn nhất của bạn. Tạo cấu trúc từ bên ngoài: cộng sự giỏi vận hành, hạn chót công khai với khách, lịch cố định."
    :"Kỷ luật của bạn ở mức khá. Một hệ thống theo dõi mục tiêu hằng tuần sẽ tạo khác biệt rõ.");
  o.push(b.O>=.65?"Bạn học nhanh cái mới, hợp với ngành đang thay đổi. Rủi ro là đổi hướng liên tục: cam kết với một hướng ít nhất 12 tháng."
    :b.O<=.4?"Bạn hợp với mô hình đã được kiểm chứng: nhượng quyền, nghề có lộ trình rõ, hoặc sao chép một mô hình đang chạy tốt rồi làm kỹ hơn."
    :"Bạn cân bằng giữa đổi mới và thực dụng: cải tiến một mô hình có sẵn thay vì phát minh từ đầu.");
  o.push(b.N>=.65?"Bạn chịu áp lực tốt, có thể nhận vai trò thu nhập biến động như bán hàng hoa hồng hoặc sáng lập."
    :b.N<=.4?"Thu nhập biến động sẽ bào mòn bạn. Giữ một khoản thu cố định đủ sống và quỹ dự phòng trước khi mạo hiểm."
    :"Bạn chịu được biến động vừa phải: kết hợp một phần thu nhập cố định với một phần theo kết quả.");
  o.push(b.A>=.7?"Bạn giữ quan hệ lâu dài tốt nhưng dễ định giá thấp và ngại đòi tiền. Dùng bảng giá cố định và hợp đồng mẫu để không phải mặc cả theo cảm tính."
    :b.A<=.4?"Bạn đàm phán cứng và dám ra quyết định khó, hợp với thương vụ và quản trị hiệu suất. Cần một người mềm hơn giữ quan hệ với khách và đội ngũ."
    :"Bạn đủ mềm để giữ quan hệ và đủ cứng để bảo vệ lợi ích của mình.");
  if((r.ctx.hours||0)===0)o.push("Với dưới 5 giờ mỗi tuần, gần như không hướng mới nào kịp ra tiền. Việc đầu tiên là giải phóng được 10 giờ mỗi tuần.");
  return o;
}

function sortedPaths(r){
  var key=state.sort==="fit"?"fit":"combined";
  return r.paths.slice().sort(function(a,b){return b[key]-a[key];});
}
function hollandCode(r){
  return Object.keys(r.ri).sort(function(a,b){return r.ri[b]-r.ri[a];}).slice(0,3);
}
function summaryText(r,ps){
  var c=r.ctx,ctxS=SECTIONS[4].items;
  var pc=function(v){return Math.round(v*100);};
  var topSk=Object.keys(r.sk).sort(function(a,b){return r.sk[b]-r.sk[a];}).slice(0,4).map(function(k){return SKILL_NAME[k]+" ("+state.ans[k]+"/5)";});
  var t="KẾT QUẢ TRẮC NGHIỆM HƯỚNG KIẾM TIỀN (Việt Nam)\n";
  t+="Mã Holland: "+hollandCode(r).join("")+" | "+Object.keys(r.ri).map(function(k){return k+" "+pc(r.ri[k]);}).join(", ")+"\n";
  t+="Big Five: "+Object.keys(r.b5).map(function(k){return B5_NAME[k]+" "+pc(r.b5[k]);}).join("; ")+"\n";
  t+="Khuynh hướng làm chủ: "+pc(r.ent)+" | Sức chịu rủi ro tài chính: "+pc(r.riskCap)+"\n";
  t+="Kỹ năng mạnh nhất: "+topSk.join("; ")+"\n";
  t+="Hoàn cảnh: "+ctxS.map(function(it){return it[1]+": "+it[2][c[it[0]]||0];}).join(" | ")+"\n";
  t+="Mô hình đề xuất: "+MODE[r.mode][0]+"\n";
  t+="5 hướng đứng đầu:\n"+ps.slice(0,5).map(function(x,i){return (i+1)+". "+x.p.name+" (độ khớp "+pc(x.fit)+"%)";}).join("\n")+"\n\n";
  t+="Dựa trên kết quả này, hãy lập cho tôi kế hoạch 90 ngày cho hướng số 1, kèm chỉ số cần đo mỗi tuần.";
  return t;
}

function renderResult(){
  var r=compute(state.ans),ps=sortedPaths(r),top=ps[0],pc=function(v){return Math.round(v*100);};
  var code=hollandCode(r);
  var html='<div class="sec-head"><h2 tabindex="-1" id="secTitle">Kết quả của bạn</h2></div>';

  html+='<section class="note">'+rosette()+
    '<div class="pct">'+pc(top.fit)+'<small>% khớp</small></div>'+
    '<h2>'+esc(top.p.name)+'</h2><p>'+esc(top.p.desc)+'</p>'+facts(top.p)+'</section>';
  html+=pathBody(top,true);

  html+='<section class="block"><h2>Mô hình làm việc nên chọn</h2><div class="mode"><h3>'+MODE[r.mode][0]+'</h3><p>'+MODE[r.mode][1]+'</p><p>'+STATUS_NOTE[r.ctx.status||0]+'</p></div></section>';

  html+='<section class="block"><h2>Các hướng tiếp theo</h2>'+
    '<div class="sortrow"><label><input type="radio" name="sort" value="combined"'+(state.sort!=="fit"?" checked":"")+'> Xếp theo độ khớp nhân với trần thu nhập</label>'+
    '<label><input type="radio" name="sort" value="fit"'+(state.sort==="fit"?" checked":"")+'> Chỉ theo độ khớp</label></div>';
  ps.slice(1,6).forEach(function(x,i){
    html+='<details class="path"><summary><span class="rank">'+(i+2)+'</span><span class="nm">'+esc(x.p.name)+'</span><span class="sc">'+pc(x.fit)+'%</span></summary>'+
      '<div class="body"><p>'+esc(x.p.desc)+'</p>'+facts(x.p)+pathBody(x,false)+'</div></details>';
  });
  html+='<ul class="rest">'+ps.slice(6).map(function(x){return '<li><span>'+esc(x.p.name)+'</span><b>'+pc(x.fit)+'%</b></li>';}).join("")+'</ul></section>';

  html+='<section class="block"><h2>Hồ sơ của bạn</h2>'+
    '<p class="sub">Mã Holland</p><div class="code">'+code.join("")+'</div><p class="fine">'+code.map(function(k){return RIASEC_NAME[k];}).join(", ")+'</p>'+
    Object.keys(r.ri).map(function(k){return meter(RIASEC_NAME[k],r.ri[k]);}).join("")+
    '<p class="sub">Tính cách</p>'+Object.keys(r.b5).map(function(k){return meter(B5_NAME[k],r.b5[k],"g");}).join("")+
    '<p class="sub">Làm chủ và rủi ro</p>'+meter("Khuynh hướng làm chủ",r.ent,"p")+meter("Sức chịu rủi ro tài chính",r.riskCap,"y")+
    '</section>';

  html+='<section class="block"><h2>Cách làm việc hợp với bạn</h2>'+list(workStyle(r))+'</section>';

  html+='<section class="block"><h2>Đào sâu cùng Claude</h2><p>Sao chép bản tóm tắt dưới đây và dán vào cuộc trò chuyện để nhận kế hoạch 90 ngày cho hướng đứng đầu.</p>'+
    '<div class="actions"><button class="btn" data-act="copy">Sao chép kết quả</button><span class="ok" id="copied" role="status"></span></div>'+
    '<textarea class="copy" id="copyBox" readonly aria-label="Bản tóm tắt kết quả">'+esc(summaryText(r,ps))+'</textarea></section>';

  html+='<section class="block"><h2>Cơ sở khoa học và giới hạn</h2><ul class="refs">'+
   '<li>Sở thích khớp với công việc dự báo hiệu suất và mức độ gắn bó: Nye, Su, Rounds & Drasgow (2012), phân tích tổng hợp trên Perspectives on Psychological Science; mô hình RIASEC của Holland (1997).</li>'+
   '<li>Sự tận tâm dự báo hiệu suất công việc ở mọi nhóm nghề: Barrick & Mount (1991). Tận tâm cao và bất ổn cảm xúc thấp gắn với thu nhập cao hơn về dài hạn: Judge, Higgins, Thoresen & Barrick (1999).</li>'+
   '<li>Người kinh doanh khác người quản lý làm thuê về tận tâm, cởi mở, ổn định cảm xúc; nhu cầu thành tựu, tự tin năng lực, chủ động và chấp nhận rủi ro tương quan với thành công kinh doanh: Zhao & Seibert (2006); Rauch & Frese (2007).</li>'+
   '<li>Sau 10 năm, thu nhập trung vị của người tự kinh doanh thấp hơn khoảng 35% so với làm thuê: Hamilton (2000), Journal of Political Economy. Kinh doanh có trần cao hơn nhưng trung vị thấp hơn.</li>'+
   '<li>Giữ việc chính khi khởi nghiệp giảm 33% nguy cơ thất bại: Raffiee & Feng (2014), Academy of Management Journal.</li>'+
   '<li>Tuổi trung bình của nhà sáng lập các công ty tăng trưởng nhanh nhất tại Mỹ là 45: Azoulay, Jones, Kim & Miranda (2020). Ở tuổi 34 bạn chưa muộn.</li>'+
   '<li>Giới hạn: bài này dùng câu hỏi tự đánh giá dạng rút gọn, chưa được chuẩn hoá trên mẫu người Việt. Các mức "trần thu nhập", "vốn", "thời gian ra tiền" là ước lượng tương đối giữa các hướng, không phải số liệu thống kê. Phần lớn nghiên cứu trích dẫn thực hiện ở Mỹ và châu Âu. Bài này không phải tư vấn tài chính.</li>'+
   '</ul></section>';

  html+='<div class="nav"><button class="btn ghost" data-act="edit">Sửa câu trả lời</button><button class="linkbtn" data-act="reset">Xoá hết và làm lại</button></div>';
  app.innerHTML=html;
}
function pathBody(x,standalone){
  var h="";
  if(x.why.length)h+='<p class="sub">Vì sao khớp</p>'+list(x.why);
  if(x.gaps.length)h+='<p class="sub">Điểm cần lưu ý</p>'+list(x.gaps);
  h+='<p class="sub">Ví dụ tại Việt Nam</p><p>'+esc(x.p.ex)+'</p>';
  h+='<p class="sub">Phép thử 30 ngày</p><p>'+esc(x.p.test)+'</p>';
  return standalone?'<section>'+h+'</section>':h;
}

function render(focus){
  if(state.stage==="intro")renderIntro();
  else if(state.stage==="result")renderResult();
  else renderSection(state.stage);
  updateBar();
  if(focus){
    window.scrollTo(0,0);
    var t=document.getElementById("secTitle");if(t)t.focus({preventScroll:true});
  }
}

/* ---------- Sự kiện ---------- */
app.addEventListener("change",function(e){
  var el=e.target;if(el.type!=="radio")return;
  if(el.name==="sort"){state.sort=el.value;save();renderResult();return;}
  if(el.name.indexOf("ctx_")===0){state.ans.ctx=state.ans.ctx||{};state.ans.ctx[el.name.slice(4)]=+el.value;}
  else state.ans[el.name]=+el.value;
  var fs=el.closest("fieldset");if(fs)fs.classList.remove("miss");
  save();updateBar();
});
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="start"){
    var first=0;
    for(var i=0;i<SECTIONS.length;i++){var s=SECTIONS[i];if(!s.items.every(function(it){return answered(s,it[0]);})){first=i;break;}first=i;}
    state.stage=first;save();render(true);
  }else if(act==="back"){
    state.stage=state.stage===0?"intro":state.stage-1;save();render(true);
  }else if(act==="next"){
    var sec=SECTIONS[state.stage],miss=sec.items.filter(function(it){return !answered(sec,it[0]);});
    if(miss.length){
      miss.forEach(function(it){var f=app.querySelector('fieldset[data-id="'+it[0]+'"]');if(f)f.classList.add("miss");});
      document.getElementById("warn").textContent="Còn "+miss.length+" câu chưa trả lời ở phần này.";
      var f0=app.querySelector("fieldset.miss");if(f0)f0.scrollIntoView({block:"center"});
      return;
    }
    state.stage=state.stage===SECTIONS.length-1?"result":state.stage+1;save();render(true);
  }else if(act==="edit"){state.stage=0;save();render(true);
  }else if(act==="reset"){
    state={stage:"intro",ans:{},sort:"combined"};save();render(true);
  }else if(act==="copy"){
    var box=document.getElementById("copyBox"),ok=document.getElementById("copied");
    var done=function(){ok.textContent="Đã sao chép kết quả";};
    var fallback=function(){box.focus();box.select();try{if(document.execCommand("copy"))done();else ok.textContent="Hãy bôi đen ô bên dưới và sao chép thủ công";}catch(err){ok.textContent="Hãy bôi đen ô bên dưới và sao chép thủ công";}};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(box.value).then(done,fallback);}else fallback();
  }
});

render(false);
})();
</script>
</body>
</html>
